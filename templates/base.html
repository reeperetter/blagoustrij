<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Хортицький район{% endblock %}</title>
        <script src="{{ url_for('static', filename='js/main.js') }}"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="icon" href="{{ url_for('static', filename='img/dragon.svg') }}" type="image/svg+xml">
        <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/dragon-180.png') }}">
        <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">

    </head>
    <body>
        {# Навігаційна панель #}
        <nav class="navigation">
            <div class="layout">
                <div class="navigation__container">
                    <a class="navigation__brand" href="{{ url_for('index') }}">Хортицький район</a>
                    <div class="navigation__menu">
                        {% if current_user.is_authenticated %}
                        <span class="navigation__text">Привіт, {{ current_user.username }}!</span>
                        {% if current_user.is_admin() %}
                        <span class="admin">Адмін</span>
                        {% endif %}
                        <a class="navigation__link" href="{{ url_for('logout') }}">Вийти</a>
                        {% else %}
                        <a class="navigation__link" href="{{ url_for('login') }}">Увійти</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </nav>

        <!-- {# Повідомлення #}
        <div class="container mt-3">
            {% with messages = get_flashed_messages(with_categories=true) %} {% if messages %} {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %} {% endif %} {% endwith %}
        </div> -->

        {# Основний контент #}
        <div class="layout layout--with-top-margin">{% block content %}{% endblock %}</div>

        {# Bootstrap JS #}
        <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script> -->
        <script>
            // Simple modal functionality
            function showModal(modalId) {
                const modal = document.getElementById(modalId);
                if (modal) {
                    modal.classList.add('modal--show');
                }
            }

            function hideModal(modalId) {
                const modal = document.getElementById(modalId);
                if (modal) {
                    modal.classList.remove('modal--show');
                }
            }

            // Close modal when clicking outside
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('modal')) {
                    hideModal(e.target.id);
                }
            });

            // Close modal with close button
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('modal__close')) {
                    const modal = e.target.closest('.modal');
                    if (modal) {
                        hideModal(modal.id);
                    }
                }
            });
        </script>
    </body>
</html>
